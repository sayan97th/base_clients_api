; =============================================================================
; Supervisor Configuration — Base Clients API
; Domain  : clients.basesearchmarketing.com
; App path: /var/www/api.portal.basesearchmarketing.com
;
; INSTALLATION
; ------------
; 1. Copy this file to /etc/supervisor/conf.d/base_clients_api.conf
; 2. Run: sudo supervisorctl reread && sudo supervisorctl update
; 3. Run: sudo supervisorctl start base_clients_api:*
;
; NOTE: Adjust `user`, `directory`, and `command` paths to match your server.
; =============================================================================


; -----------------------------------------------------------------------------
; [1] Laravel Horizon — manages all queue workers (default + emails queues)
;     Horizon internally spawns the supervisor-1 and supervisor-emails workers
;     defined in config/horizon.php. No separate queue:work processes needed.
; -----------------------------------------------------------------------------
[program:base_clients_api_horizon]
process_name    = %(program_name)s
command         = php /var/www/api.portal.basesearchmarketing.com/artisan horizon
directory       = /var/www/api.portal.basesearchmarketing.com
autostart       = true
autorestart     = true
user            = www-data
numprocs        = 1
redirect_stderr = true
stdout_logfile  = /var/www/api.portal.basesearchmarketing.com/storage/logs/horizon.log
stdout_logfile_maxbytes = 50MB
stdout_logfile_backups  = 5
stopwaitsecs    = 3600
stopsignal      = SIGTERM
startsecs       = 5
startretries    = 3
priority        = 100


; -----------------------------------------------------------------------------
; [2] Laravel Scheduler — runs artisan schedule:run every minute.
;     Handles: notifications:unsnooze and horizon:snapshot (defined in Kernel).
;     Alternative: add `* * * * * www-data php artisan schedule:run` to crontab.
;     Use this program ONLY if you prefer supervisor over cron.
; -----------------------------------------------------------------------------
[program:base_clients_api_scheduler]
process_name    = %(program_name)s
command         = php /var/www/api.portal.basesearchmarketing.com/artisan schedule:work
directory       = /var/www/api.portal.basesearchmarketing.com
autostart       = true
autorestart     = true
user            = www-data
numprocs        = 1
redirect_stderr = true
stdout_logfile  = /var/www/api.portal.basesearchmarketing.com/storage/logs/scheduler.log
stdout_logfile_maxbytes = 20MB
stdout_logfile_backups  = 3
stopwaitsecs    = 60
stopsignal      = SIGTERM
startsecs       = 5
startretries    = 3
priority        = 200


; -----------------------------------------------------------------------------
; [3] Laravel Reverb — WebSocket server for real-time broadcasting
;     Runs the WebSocket server used by Laravel Echo / broadcasting system.
;     Default port is defined in config/reverb.php (commonly 8080).
;     IMPORTANT: Do NOT use --debug in production environments.
; -----------------------------------------------------------------------------
[program:base_clients_api_reverb]
process_name    = %(program_name)s
command         = php /var/www/api.portal.basesearchmarketing.com/artisan reverb:start
directory       = /var/www/api.portal.basesearchmarketing.com
autostart       = true
autorestart     = true
user            = www-data
numprocs        = 1
redirect_stderr = true
stdout_logfile  = /var/www/api.portal.basesearchmarketing.com/storage/logs/reverb.log
stdout_logfile_maxbytes = 50MB
stdout_logfile_backups  = 5
stopwaitsecs    = 60
stopsignal      = SIGTERM
startsecs       = 5
startretries    = 3
priority        = 150


; -----------------------------------------------------------------------------
; [group] — manage all programs as a single group
; -----------------------------------------------------------------------------
[group:base_clients_api]
programs = base_clients_api_horizon,base_clients_api_scheduler,base_clients_api_reverb
priority = 999
